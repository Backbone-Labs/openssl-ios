## OpenSSL Configure targets for Apple TV. scripts/build-xcframework.sh loads
## this file with --config for the two tvOS slices only.
##
## OpenSSL 3.5 ships iOS targets (Configurations/15-ios.conf) but none for tvOS.
## Each target here is its iOS counterpart with the tvOS SDK: tvos64-xcrun
## mirrors ios64-xcrun and tvossimulator-arm64-xcrun mirrors
## iossimulator-arm64-xcrun, attribute for attribute. Adapted from fuji-tvos's
## Packages/NeoFujiClient/scripts/openssl-apple-targets.conf.
##
## Two things are easy to get wrong:
##  - bn_ops MUST be set on both targets. Left to inherit, it comes from
##    darwin-common as "BN_LLONG RC4_CHAR": 32-bit bignum limbs, while the
##    aarch64 assembly assumes 64-bit ones. Nothing fails to build. EC point
##    math is simply wrong at runtime, which breaks SPAKE2 PIN pairing. The
##    P-256 checks in scripts/smoke/smoke.c catch it.
##  - fork() is __TVOS_PROHIBITED in the tvOS SDK, hence HAVE_FORK=0.
##
## The deployment target is passed on the command line, as it is for iOS, from
## TVOS_DEPLOYMENT_TARGET in scripts/openssl-source.env, so both tvOS slices
## always agree.
my %targets = (
    "tvos-common" => {
        template       => 1,
        inherit_from   => [ "ios-common" ],
        defines        => add("HAVE_FORK=0"),
    },
    "tvos64-xcrun" => {
        inherit_from   => [ "tvos-common" ],
        CC             => "xcrun -sdk appletvos cc",
        cflags         => add("-arch arm64 -fno-common"),
        bn_ops         => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch       => 'aarch64',
        perlasm_scheme => "ios64",
    },
    "tvossimulator-arm64-xcrun" => {
        inherit_from   => [ "tvos-common" ],
        CC             => "xcrun -sdk appletvsimulator cc",
        cflags         => add("-arch arm64 -fno-common"),
        bn_ops         => "SIXTY_FOUR_BIT_LONG",
        asm_arch       => 'aarch64',
        perlasm_scheme => "ios64",
    },
);
